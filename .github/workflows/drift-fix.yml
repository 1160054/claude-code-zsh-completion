name: Drift Fix

# When the drift check finds the CLI ahead of completions/_claude, Claude
# updates the completion and opens a PR. A maintainer reviews and merges it;
# nothing here merges or releases.
#
# Started by drift-check.yml (or by hand). It never reads issue text: Claude
# finds the gaps itself from the installed CLI, so an issue body cannot steer it.
# Needs the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret; without one it
# skips with a notice.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to start from (main in normal use; another branch to test this workflow)'
        default: main

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: drift-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Skip unless a key is set and no drift PR is open
      id: gate
      env:
        GH_TOKEN: ${{ github.token }}
        HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      run: |
        if [ "$HAS_KEY" != "true" ]; then
          echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret, skipping"
          echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
          --jq '[.[] | select(.headRefName | startswith("drift/"))] | length')
        if [ "$open" != "0" ]; then
          echo "::notice::A drift PR is already open, skipping"
          echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        echo "run=true" >> "$GITHUB_OUTPUT"

    - name: Checkout code
      if: steps.gate.outputs.run == 'true'
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref || 'main' }}

    - name: Install zsh
      if: steps.gate.outputs.run == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y zsh file

    - name: Setup Node.js
      if: steps.gate.outputs.run == 'true'
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Install Claude CLI
      if: steps.gate.outputs.run == 'true'
      run: npm install -g @anthropic-ai/claude-code

    - name: Update the completion
      id: claude
      if: steps.gate.outputs.run == 'true'
      uses: anthropics/claude-code-action@v1
      env:
        # Commits are the maintainer's: author and committer, no AI attribution.
        GIT_AUTHOR_NAME: Yudai Onodera
        GIT_AUTHOR_EMAIL: 9334235+1160054@users.noreply.github.com
        GIT_COMMITTER_NAME: Yudai Onodera
        GIT_COMMITTER_EMAIL: 9334235+1160054@users.noreply.github.com
      with:
        anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        github_token: ${{ github.token }}
        prompt: |
          The installed `claude` CLI has commands or options that completions/_claude
          does not complete. Bring the completion up to date and open a pull request.

          1. Run `zsh .github/workflows/test.zsh --drift-only` to list the gaps.
             It only reads the top-level `claude --help`; also run `claude <command> --help`
             for each command and subcommand, because nested options are missed by it.
             Never run `claude <command> help <sub>`: it starts an interactive session.
             If nothing is missing, stop here without changing any file or opening a PR.
          2. Update completions/_claude, the source of truth, following the existing style.
             Remove nothing that the CLI still has.
          3. Copy completions/_claude over every completions/_claude.en-* file (they are identical to it).
          4. Translate the new entries in these locales, line-aligned with _claude and
             reusing each file's own wording for repeated phrases like --json and -h:
             ja ko zh-CN zh-TW es fr de it pt-BR ru tr pl. Leave every other locale as it is.
             Never put [ or ] inside a description.
          5. Add an entry under `## [Unreleased]` in CHANGELOG.md (Keep a Changelog style,
             matching the earlier entries). Create that heading above the newest release if missing.
          6. Run `zsh .github/workflows/test.zsh` and fix until it passes.
          7. Create a branch named `drift/<cli version>`, commit with plain `git commit` and a
             one-line message (leave the author and committer as configured), and push it.
             Add no Co-authored-by trailer and no AI attribution to the commit or the PR body.
             Do not open the PR yourself; a later step does. Write the branch name to
             /tmp/drift-pr/branch, a one-line PR title to /tmp/drift-pr/title, and a short PR body
             (what changed, and the CLI version) to /tmp/drift-pr/body.md.
          Do not merge anything, create tags, or publish releases.
        settings: |
          {"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}}
        claude_args: |
          --max-turns 150
          --allowedTools "Read,Edit,Write,Glob,Grep,Bash"
          --disallowedTools "Bash(gh pr create:*),Bash(gh pr merge:*),Bash(gh release:*),Bash(git tag:*),Bash(git push --force:*),Bash(git push -f:*),Bash(gh secret:*),Bash(gh api:*)"

    - name: Open the PR
      if: steps.gate.outputs.run == 'true'
      env:
        # Opened as the maintainer so the PR's CI runs without an approval.
        # Claude never sees this token.
        GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || github.token }}
      run: |
        if [ ! -s /tmp/drift-pr/branch ]; then
          echo "::notice::Claude pushed no branch, so there is no PR to open"
          exit 0
        fi
        branch=$(head -1 /tmp/drift-pr/branch)
        title=$(head -1 /tmp/drift-pr/title 2>/dev/null || echo "Update the completion for the current claude CLI")
        [ -s /tmp/drift-pr/body.md ] || echo "Brings the completion up to date with the current claude CLI." > /tmp/drift-pr/body.md
        gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
          --title "$title" --body-file /tmp/drift-pr/body.md

    - name: Keep Claude's transcript
      if: always() && steps.claude.outputs.execution_file != ''
      uses: actions/upload-artifact@v4
      with:
        name: drift-fix-transcript
        path: ${{ steps.claude.outputs.execution_file }}
        retention-days: 14
