name: Completion Drift Check

# The test suite already compares completions/_claude against `claude --help`,
# but it only runs on push and pull requests - so a CLI release goes unnoticed
# until somebody happens to push. This runs the same check on a schedule and
# files an issue when the completion falls behind.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install zsh
      run: |
        sudo apt-get update
        sudo apt-get install -y zsh

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Install Claude CLI
      run: npm install -g @anthropic-ai/claude-code

    - name: Check for drift
      id: drift
      run: |
        set +e
        zsh .github/workflows/test.zsh --drift-only 2>&1 | tee drift.log
        status=${PIPESTATUS[0]}
        set -e

        # Strip the colour escapes so the issue body stays readable
        sed -i 's/\x1b\[[0-9;]*m//g' drift.log

        echo "cli_version=$(claude --version 2>&1)" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit 0

    - name: File or update the drift issue
      if: steps.drift.outputs.status != '0'
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: "Completion drift: claude CLI has moved ahead of completions/_claude"
        CLI_VERSION: ${{ steps.drift.outputs.cli_version }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        {
          echo "The scheduled drift check found commands or options in \`claude --help\` that"
          echo "\`completions/_claude\` does not complete."
          echo
          echo "- Claude CLI: \`${CLI_VERSION}\`"
          echo "- Workflow run: ${RUN_URL}"
          echo
          echo '```'
          cat drift.log
          echo '```'
          echo
          echo "Update \`completions/_claude\` first - it is the source of truth - then"
          echo "propagate the change to the locale files."
        } > body.md

        existing=$(gh issue list --state open --search "in:title \"Completion drift\"" \
          --json number,title --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")

        if [ -n "$existing" ]; then
          echo "Updating existing issue #${existing}"
          gh issue comment "$existing" --body-file body.md
        else
          echo "Opening a new issue"
          gh issue create --title "$TITLE" --body-file body.md
        fi

    - name: Fail the run when drift was found
      if: steps.drift.outputs.status != '0'
      run: exit 1
